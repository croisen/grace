name: grace
description: "Practice language syntax via instructions given in flashcards"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+69

environment:
  sdk: ^3.14.0-111.0.dev

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  rust_lib_grace:
    path: rust_builder
  flutter_code_editor: ^0.3.5
  flutter_highlight: ^0.7.0
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0
  highlight: ^0.7.0
  shared_preferences: ^2.5.6
  sqflite: ^2.4.6
  sqflite_ffi: ^0.1.1+2
  path_provider: ^2.1.6
  path: ^1.9.1
  material_ui: ^1.11.1
  provider: ^6.1.5+1
  flutter_localizations:
    sdk: flutter

