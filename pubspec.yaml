name: grace
description: "Practice language syntax via instructions given in flashcards"
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.14.0-111.0.dev

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  rust_lib_grace:
    path: rust_builder
  flutter_code_editor: ^0.3.5
  flutter_highlight: ^0.7.0
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0
  highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.17.1
  dart_pubspec_licenses: ^3.2.0
  flutter_lints: ^6.0.0
  freezed: ^4.0.3
  integration_test:
    sdk: flutter

