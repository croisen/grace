[package]
name = "rust_lib_grace"
version = "1.0.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "rust-lib-grace"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
flutter_rust_bridge = "=2.13.0"
fsrs = { version = "7.0.0", default-features = false }
libc = { version = "0.2.189", default-features = false, features = ["align", "const-extern-fn", "extra_traits", "use_std"] }
logos = { version = "0.16.1", default-features = false, features = ["export_derive", "logos-derive", "state_machine_codegen", "std"] }
rand = { version = "0.10.3", default-features = false, features = ["chacha", "serde", "thread_rng"] }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-threads", "--enable-bulk-memory", "--enable-mutable-globals", "--enable-nontrapping-float-to-int"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
opt-level     = "z"
strip         = "symbols"
lto           = "fat"
incremental   = true
codegen-units = 1
panic         = "abort"

[profile.dev]
opt-level     = "z"
strip         = "none"
lto           = "off"
incremental   = false
codegen-units = 16
