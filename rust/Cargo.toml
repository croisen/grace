[package]
name = "rust-lib-grace"
version = "0.0.1"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
flutter_rust_bridge = "=2.13.0"
libc = { version = "0.2.189", default-features = false, features = ["align", "const-extern-fn", "extra_traits", "use_std"] }
logos = { version = "0.16.1", default-features = false, features = ["export_derive", "logos-derive", "state_machine_codegen", "std"] }
rand = { version = "0.10.3", default-features = false, features = ["chacha", "serde", "thread_rng"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
opt-level     = "z"
strip         = "symbols"
lto           = "fat"
incremental   = true
codegen-units = 1
panic         = "abort"

[profile.dev]
opt-level     = "z"
strip         = "none"
lto           = "off"
incremental   = false
codegen-units = 16
