[package]
name = "rust_lib_grace"
version = "0.0.1"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "rust-lib-grace"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
flutter_rust_bridge = "=2.13.0"
fsrs = { version = "7.0.0", default-features = false }
libc = { version = "0.2.189", default-features = false, features = ["align", "const-extern-fn", "extra_traits", "use_std"] }
oak-core = { git = "https://github.com/croisen/oak.rs" }
oak-java = { git = "https://github.com/croisen/oak.rs" }
oak-rust = { git = "https://github.com/croisen/oak.rs" }
oak-sql = { git = "https://github.com/croisen/oak.rs" }
# oak-core = { path = "/home/croisen/git/college/oak.rs/projects/oak-core" }
# oak-java = { path = "/home/croisen/git/college/oak.rs/examples/oak-java" }
# oak-rust = { path = "/home/croisen/git/college/oak.rs/examples/oak-rust" }
# oak-sql = { path = "/home/croisen/git/college/oak.rs/examples/oak-sql" }
rand = { version = "0.10.3", default-features = false, features = ["chacha", "serde", "thread_rng"] }
unicode-segmentation = { version = "1", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
opt-level     = "z"
strip         = "symbols"
lto           = "fat"
incremental   = true
codegen-units = 1
panic         = "abort"

[profile.dev]
opt-level     = "z"
strip         = "none"
lto           = "off"
incremental   = false
codegen-units = 16
